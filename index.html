<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K&amp;D Beer Fest - Pint Guide</title>
<style>
@font-face{font-family:'Eurostile Ext Bold';src:url('fonts/Eurostile-Extended-Bold.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Eurostile Ext';src:url('fonts/Eurostile-Regular-Extended.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
/* Modern and playful: Round Table grey and yellow, soft rounded cards, chunky buttons. */
:root{
  --bg:#F5F2E9; --ink:#1D1D1A; --ink2:#3A3A35; --muted:#6B6A62; --line:#E6E0CF;
  --yellow:#FBAF33; --yellow-d:#B87A10; --yellow-soft:#FFF1D2; --card:#fff;
  --good:#2E7D32; --warn:#B3501A;
  --display:'Eurostile Ext Bold','Eurostile','Arial Black',sans-serif;
  --body:'Eurostile Ext','Eurostile','Trebuchet MS',system-ui,sans-serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);font-size:14px;line-height:1.45;color:var(--ink);-webkit-text-size-adjust:100%;font-synthesis:none;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12% 18%,rgba(251,175,51,.16) 0 70px,transparent 71px),radial-gradient(circle at 92% 42%,rgba(251,175,51,.13) 0 110px,transparent 111px),radial-gradient(circle at 20% 82%,rgba(29,29,26,.05) 0 90px,transparent 91px);
  background-attachment:fixed}
button,.tag,.abv,.mine,.avg,.count,b,strong,dt,.lab span,.linkbtn,.star,.num,.chip,.pc small{font-family:var(--display);font-weight:400}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;font-size:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--ink);border-radius:0 0 28px 28px;padding:10px 0 14px;box-shadow:0 10px 24px rgba(29,29,26,.25);overflow:hidden}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(251,175,51,.14);pointer-events:none}
header::before{width:90px;height:90px;right:-20px;top:-30px}
header::after{width:46px;height:46px;left:46%;bottom:-18px}
.logos{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-radius:999px;padding:5px 16px;margin:0 16px 10px}
.logos img:first-child{height:28px;width:auto;max-width:62%}
.logos img:last-child{height:32px;width:auto}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top>div:first-child{min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1;margin:0;color:var(--yellow);text-wrap:balance}
h1 span{color:#fff;display:block}
.tagline{font-size:9px;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;color:#B9B7AB;margin-top:4px}
.who{font-size:11px;color:#E6E0CF;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.linkbtn{background:var(--yellow);border:none;padding:7px 14px;border-radius:999px;white-space:nowrap;color:var(--ink);font-size:11px;box-shadow:0 3px 0 var(--yellow-d)}
.linkbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-d)}
.who .linkbtn{background:none;box-shadow:none;color:var(--yellow);padding:4px 0;text-decoration:underline}

/* search + filters */
.tools{display:flex;gap:8px;margin-top:16px}
.tools input{flex:1;min-width:0;padding:13px 18px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(29,29,26,.06)}
.tools input::placeholder{color:#9B9889}
.tools input:focus{border-color:var(--yellow);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--yellow);transform:translateY(-1px) rotate(-1.5deg)}

.count{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--yellow-soft);border-radius:999px;padding:6px 14px;margin:14px 0 12px}
.banner{background:var(--yellow);color:var(--ink);border-radius:var(--r);padding:14px 16px;margin:14px 0 0;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 6px 0 var(--yellow-d)}
.banner p{margin:0;font-size:13px}
.btn{background:var(--ink);color:var(--yellow);border:none;border-radius:999px;padding:12px 20px;letter-spacing:.04em;text-transform:uppercase;font-size:12px;box-shadow:0 4px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.list{display:flex;flex-direction:column;gap:16px;padding-bottom:80px}

/* beer card */
.card{--tagbg:var(--yellow);--tagfg:var(--ink);background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 24px rgba(29,29,26,.09);transition:transform .15s,box-shadow .15s}
.card[data-cat="keg"]{--tagbg:var(--ink);--tagfg:#fff}
.card[data-cat="cider"]{--tagbg:#E9E4D4;--tagfg:var(--ink)}
.card:active{transform:scale(.992)}
.card>button.head{width:100%;text-align:left;background:none;border:none;padding:14px;display:grid;grid-template-columns:76px 1fr auto;gap:4px 14px;align-items:start}
.card .name{grid-column:2;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15;color:var(--ink);text-wrap:balance}
.card .brew{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.thumb{grid-row:1/3;grid-column:1;width:76px;height:76px;border-radius:22px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;transform:rotate(-3deg);box-shadow:inset 0 0 0 2px rgba(251,175,51,.35)}
.thumb img,.thumb .bimg{width:100%;height:100%;object-fit:cover}
.bimg.ph svg{width:70%;height:70%}
.logo{flex:none;border-radius:50%;object-fit:contain;background:#fff;border:2px solid var(--line)}
.logo.sm{width:24px;height:24px}
.logo.lg{width:52px;height:52px}
.logo.ph{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);border-color:var(--ink);color:var(--yellow);font-family:var(--display);font-weight:400}
.logo.ph.sm{font-size:10px}
.logo.ph.lg{font-size:19px}
.hero{display:block;width:100%;aspect-ratio:4/3;max-height:240px;margin:12px 0 0;border-radius:18px;object-fit:cover;background:var(--yellow-soft)}
.hero.ph{display:flex;align-items:center;justify-content:center}
.hero.ph svg{height:70%}
.brewbox{display:flex;gap:10px;align-items:flex-start}
.brewbox b{display:block;color:var(--ink)}
.abv{font-variant-numeric:tabular-nums;background:var(--yellow);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;transform:rotate(4deg);box-shadow:0 3px 0 var(--yellow-d)}
.prices{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.prices .pc{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 7px;border-radius:14px;background:var(--bg)}
.prices .pc:last-child{background:var(--yellow-soft);box-shadow:inset 0 0 0 2px rgba(251,175,51,.6)}
.prices small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prices b{font-size:14px;color:var(--ink)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;align-items:center}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--tagbg);color:var(--tagfg)}
.tag.price{background:transparent;border:1.5px solid var(--yellow);color:var(--ink)}
.avg{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mine{font-size:12px;color:var(--good)}
.body{padding:0 16px 18px;border-top:2px dashed var(--line)}
.body dl{margin:14px 0 0;display:grid;grid-template-columns:92px 1fr;gap:10px 10px;font-size:13px}
.body dt{color:#8A5A00;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.body dd{margin:0}
.votes{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}

/* rating panel */
.rate{margin-top:18px;padding:16px;background:var(--yellow-soft);border-radius:20px}
.rate h3{font-family:var(--display);font-weight:400;margin:0 0 12px;font-size:15px;color:var(--ink)}
.row{margin-bottom:16px}
.row label,.row .lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.row .lab small{color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px;text-align:right;font-family:var(--body)}
.stars{display:flex;gap:6px}
.star,.num,.size{background:#fff;border:2px solid transparent;color:#B9B3A0;border-radius:16px;box-shadow:0 3px 0 rgba(29,29,26,.1)}
.star{flex:1;max-width:58px;height:46px;font-size:21px;line-height:1}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.num{height:44px;font-size:18px;font-variant-numeric:tabular-nums}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{padding:12px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.size .szp{display:block;font-size:12px;opacity:.7;margin-top:2px;font-family:var(--body)}
.star[aria-pressed="true"],.num[aria-pressed="true"],.size[aria-pressed="true"]{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.glassrow{display:flex;align-items:center;gap:14px}
.glassbox{flex:none;width:84px}
.glassbox svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(29,29,26,.18))}
.glassright{flex:1;min-width:0}
.glassnum{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;color:var(--ink)}
.glassnum b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1}
.glassnum small{color:var(--muted);font-size:12px}
.glassrange{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;touch-action:pan-y}
.glassrange::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--yellow) var(--pct,0%),#fff var(--pct,0%));box-shadow:inset 0 0 0 2px rgba(29,29,26,.12)}
.glassrange::-moz-range-track{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--yellow) var(--pct,0%),#fff var(--pct,0%));box-shadow:inset 0 0 0 2px rgba(29,29,26,.12)}
.glassrange::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-9px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 0 rgba(29,29,26,.3)}
.glassrange::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.submit{width:100%;margin-top:4px;padding:15px 20px;font-size:13px;background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-d)}
.submit:active{box-shadow:0 1px 0 var(--yellow-d)}
.submit:disabled{background:#E6E0CF;color:#9B9889;box-shadow:none;cursor:default}
.status{font-size:13px;color:var(--ink2);min-height:20px;margin-top:8px;text-align:center}
.signin-prompt{background:var(--yellow-soft);color:var(--ink);border-radius:18px;padding:14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.empty{text-align:center;color:var(--ink2);padding:40px 16px;background:#fff;border-radius:var(--r)}

/* sign-in sheet */
.scrim{position:fixed;inset:0;background:rgba(29,29,26,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.open{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 20px 28px;max-height:92%;overflow-y:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;color:var(--ink)}
.sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.authbtns{display:grid;gap:10px;margin:14px 0}
.authbtn{width:100%;padding:14px 16px}
#emailForm{margin:6px 0 10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-family:var(--display)}
.field input[type=text],.field input[type=email]{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--yellow);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12px;margin:6px 0 14px}
.check input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--yellow)}
.err{color:var(--warn);font-size:12px;min-height:20px;margin-bottom:8px}
.sheet .btns{display:flex;gap:8px}
.sheet .btns .btn{flex:1}

/* motion */
.conf{position:fixed;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:99}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){
  .list.intro .card{animation:rise .5s both cubic-bezier(.2,.8,.3,1)}
  .list.intro .card:nth-child(2){animation-delay:.05s}.list.intro .card:nth-child(3){animation-delay:.1s}.list.intro .card:nth-child(4){animation-delay:.15s}.list.intro .card:nth-child(n+5){animation-delay:.2s}
  .star,.num,.size,.btn,.chip,.linkbtn{transition:transform .12s,box-shadow .12s,background .15s}
  .star[aria-pressed="true"],.size[aria-pressed="true"]{animation:pop .25s}
  .sheet{animation:rise .3s both}
}
</style>
</head>
<body>
<header>
<div class="logos"><img src="images/brand/round-table-gbi.svg" alt="Round Table Great Britain &amp; Ireland"><img src="images/brand/knowle-dorridge-812.png" alt="Knowle &amp; Dorridge Round Table 812"></div>
  <div class="wrap">
    <div class="top">
      <div><h1>K&amp;D Beer Fest <span>Pint Guide</span></h1><div class="tagline">Ales · Kegs · Ciders</div></div>
      <div class="who" id="who"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools"><input id="q" type="search" placeholder="Search beer, brewery or number" aria-label="Search beers"></div>
  <div class="chips" id="chips" role="group" aria-label="Filter by style"></div>
  <div class="banner" id="banner" hidden>
    <p><b>Rate the beers you try.</b> Sign in to score each one.</p>
    <button class="btn" id="bannerBtn" type="button">Sign in</button>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="list" id="list"></div>
</main>

<div class="scrim" id="signScrim" role="dialog" aria-modal="true" aria-labelledby="signTitle">
  <div class="sheet">
    <h2 id="signTitle">Sign in to rate</h2>
    <div id="stepAuth">
      <p class="sub">Sign in so your ratings stay with you.</p>
      <div class="authbtns" id="authBtns"></div>
      <form id="emailForm" novalidate hidden>
        <div class="field"><label for="aEmail">Email address</label><input id="aEmail" type="email" autocomplete="email" inputmode="email"></div>
        <button class="btn" type="submit" style="width:100%">Email me a sign-in link</button>
      </form>
      <div class="err" id="authErr" role="alert"></div>
      <div class="btns"><button class="btn alt" type="button" id="signCancel">Not now</button></div>
    </div>
    <form id="signForm" novalidate hidden>
      <p class="sub" id="profSub">Tell us who you are.</p>
      <div class="field"><label for="fName">Your name</label><input id="fName" type="text" autocomplete="name" required></div>
      <div class="field"><label for="fEmail">Email address</label><input id="fEmail" type="email" autocomplete="email" inputmode="email" required></div>
      <label class="check"><input id="fConsent" type="checkbox"><span>Yes, the festival organisers can email me about future events and offers. I can unsubscribe at any time.</span></label>
      <div class="err" id="signErr" role="alert"></div>
      <div class="btns"><button class="btn alt" type="button" id="signOutBtn">Cancel</button><button class="btn" type="submit">Start rating</button></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

 {"cat": "Cask", "num": 1, "name": "Tempo", "brewery": "Siren", "type": "Pale Ale", "abv": 3.8, "place": "Finchampstead, Berkshire", "about": "Modern craft brewery founded in 2013, known for fruit-forward pales and IPAs, including its best-selling Lumina.", "notes": "Brewed specially for cask.", "taste": "Bright and easy drinking. Sweet tropical fruit, sticky peach and citrus zest, finishing crisp with gentle bitterness.", "pairing": "Fish and chips, grilled chicken, summer salads."},

    wrap.appendChild(status);
  }
  if(st.n || st.sizes.third+st.sizes.half+st.sizes.full){
    wrap.appendChild(h("div",{class:"votes",text:"Size votes: "+st.sizes.third+" third · "+st.sizes.half+" half · "+st.sizes.full+" full pint"}));
  }
  return wrap;
}

/* ============ BACKEND (Supabase) ============ */
var CFG = window.PINT || {};
var LIVE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR_/.test(CFG.supabaseUrl) && window.supabase);
var sb = LIVE ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
var dirtyIds = {};

var saveTimer=null, saving=false, pending=[];
function queueSave(cb){ pending.push(cb); clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); }
async function flush(){
  if(saving){saveTimer=setTimeout(flush,400);return}
  saving=true; var cbs=pending; pending=[];
  var ok=false;
  if(LIVE){
    if(authUser){
      var ids=Object.keys(dirtyIds); dirtyIds={};
      var rows=ids.map(function(id){var r=mine[id]||{};return {user_id:authUser.id,beer_id:id,price:r.price||null,taste:r.taste||null,score:typeof r.score==="number"?r.score:null,size:r.size||null,updated_at:new Date().toISOString()}});
      try{
        if(rows.length){ var res=await sb.from("ratings").upsert(rows,{onConflict:"user_id,beer_id"}); ok=!res.error; if(res.error) ids.forEach(function(id){dirtyIds[id]=1}); }
        else ok=true;
      }catch(e){ ok=false; ids.forEach(function(id){dirtyIds[id]=1}); }
      if(ok) loadStats();
    }
  } else { lsSet("pc_mine",mine); }
  saving=false; cbs.forEach(function(f){f(ok)});
}
async function loadStats(){
  if(!LIVE) return;
  try{
    var res=await sb.from("beer_stats").select("*");
    if(res.error||!res.data) return;
    var next={}; res.data.forEach(function(r){ next[r.beer_id]={n:Number(r.n)||0,avg:Number(r.avg_score)||0,third:Number(r.third)||0,half:Number(r.half)||0,full:Number(r.full)||0}; });
    STATS=next; renderList();
  }catch(e){}
}

/* ============ SIGN IN ============ */
function showStep(step){ $("#stepAuth").hidden=step!=="auth"; $("#signForm").hidden=step!=="profile"; }
function buildAuth(){
  var box=$("#authBtns"); box.textContent="";
  var p=CFG.providers||{google:true,apple:false,email:true};
  if(p.google) box.appendChild(h("button",{class:"btn authbtn",type:"button",text:"Continue with Google",on:{click:function(){oauth("google")}}}));
  if(p.apple) box.appendChild(h("button",{class:"btn authbtn",type:"button",text:"Continue with Apple",on:{click:function(){oauth("apple")}}}));
  if(p.email) box.appendChild(h("button",{class:"btn alt authbtn",type:"button",text:"Continue with email",on:{click:function(){$("#emailForm").hidden=false;$("#aEmail").focus()}}}));
}
function openSign(){
  $("#authErr").textContent=""; $("#signErr").textContent="";
  if(!LIVE || authUser){
    var pf=profile||{}; var meta=(authUser&&authUser.user_metadata)||{};
    $("#fName").value=pf.name||meta.full_name||meta.name||"";
    $("#fEmail").value=pf.email||(authUser&&authUser.email)||"";
    $("#fConsent").checked=!!pf.consent;
    $("#profSub").textContent=LIVE?"Nearly there. Tell us who you are.":"Tell us who you are so your ratings stay with you.";
    showStep("profile");
  } else { buildAuth(); $("#emailForm").hidden=true; showStep("auth"); }
  $("#signScrim").classList.add("open");
}
function closeSign(){ $("#signScrim").classList.remove("open"); }
async function oauth(provider){
  $("#authErr").textContent="";
  var res=await sb.auth.signInWithOAuth({provider:provider,options:{redirectTo:location.origin+location.pathname}});
  if(res.error) $("#authErr").textContent="Could not start "+provider+" sign-in. Try email instead.";
}
async function submitEmail(e){
  e.preventDefault();
  var email=$("#aEmail").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){$("#authErr").textContent="Enter a valid email address.";return}
  var res=await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname}});
  $("#authErr").textContent=res.error?"Could not send the link. Try again in a minute.":"Check your inbox for a sign-in link, then open it on this phone.";
}
async function submitSign(e){
  e.preventDefault();
  var name=$("#fName").value.trim(), email=$("#fEmail").value.trim(), consent=$("#fConsent").checked;
  if(name.length<2){$("#signErr").textContent="Enter your name.";return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){$("#signErr").textContent="Enter a valid email address, like name@example.com.";return}
  if(LIVE){
    var res=await sb.from("profiles").upsert({id:authUser.id,name:name,email:email,marketing_consent:consent,updated_at:new Date().toISOString()});
    if(res.error){$("#signErr").textContent="Could not save your details. Check your signal and try again.";return}
  } else { lsSet("pc_profile",{name:name,email:email,consent:consent}); }
  profile={name:name,email:email,consent:consent};
  closeSign(); renderWho(); renderList();
}
async function signOut(){
  if(LIVE){ await sb.auth.signOut(); }
  else { try{localStorage.removeItem("pc_profile");localStorage.removeItem("pc_mine")}catch(e){} profile=null; mine={}; renderWho(); renderList(); }
}
async function handleSession(session){
  authUser=session?session.user:null;
  if(!authUser){ profile=null; mine={}; drafts={}; renderWho(); renderList(); return; }
  var p=await sb.from("profiles").select("name,email,marketing_consent").eq("id",authUser.id).maybeSingle();
  if(p.data){ profile={name:p.data.name,email:p.data.email,consent:!!p.data.marketing_consent}; closeSign(); }
  else { profile=null; openSign(); }
  var r=await sb.from("ratings").select("beer_id,price,taste,score,size").eq("user_id",authUser.id);
  mine={}; drafts={};
  (r.data||[]).forEach(function(x){ mine[x.beer_id]={price:x.price||undefined,taste:x.taste||undefined,score:x.score==null?undefined:x.score,size:x.size||undefined}; });
  renderWho(); renderList();
}

/* ============ INIT ============ */
function wire(){
  $("#q").addEventListener("input",function(e){query=e.target.value.trim().toLowerCase();renderList()});
  $("#bannerBtn").addEventListener("click",openSign);
  $("#signForm").addEventListener("submit",submitSign);
  $("#emailForm").addEventListener("submit",submitEmail);
  $("#signCancel").addEventListener("click",closeSign);
  $("#signOutBtn").addEventListener("click",function(){ closeSign(); if(LIVE&&authUser) signOut(); });
  $("#signScrim").addEventListener("click",function(e){if(e.target.id==="signScrim")closeSign()});
}
function applyList(list){
  BEERS=list; openId=null;
  if(types().indexOf(filterType)<0) filterType="All";
  renderChips(); renderList();
}
async function loadBeers(){
  try{
    var res=await fetch("beers.json",{cache:"no-cache"}); if(!res.ok) return;
    var data=await res.json(); var rows=Array.isArray(data)?data:(data.beers||[]);
    if(rows.length) applyList(dedupe(rows.map(function(r){return mkBeer(r,data.edition||EDITION)})));
  }catch(e){}
}
async function init(){
  wire(); renderChips(); renderWho(); $("#list").classList.add("intro"); renderList();
  setTimeout(function(){ $("#list").classList.remove("intro") },1500);
  loadBeers();
  if(!LIVE){
    profile=lsGet("pc_profile"); mine=lsGet("pc_mine")||{};
    renderWho(); renderList();
    return;
  }
  sb.auth.onAuthStateChange(function(ev,session){ setTimeout(function(){handleSession(session)},0); });
  loadStats();
  setInterval(function(){ if(!document.hidden) loadStats(); },60000);
}
init();
</script>
